version: 2
models:
  - name: customers_history
    description: "Selective SCD2 with Type 1 corrections applied to all versions."
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: business_key
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
  - name: products_history
    description: "Selective SCD2 with Type 1 corrections applied to all versions."
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: business_key
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
  - name: resellers_history
    description: "Selective SCD2 with Type 1 corrections applied to all versions."
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: business_key
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
  - name: customers_current
