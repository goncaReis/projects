name: olist
version: '2.0.0'
config-version: 2
profile: olist
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]
vars:
  # Only these business attributes open new dimension versions.
  scd2_columns:
    customers: [customer_zip_code_prefix, customer_city, customer_state]
    products: [product_category_name]
    resellers: [seller_zip_code_prefix, seller_city, seller_state]
models:
  olist:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
seeds:
  olist:
    +schema: silver
