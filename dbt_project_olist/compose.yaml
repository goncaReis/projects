name: olist-medallion
services:
  postgres:
    image: postgres:16
    # Parallel hash joins in dbt tests exceed Docker's default 64 MB /dev/shm.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_local}
      POSTGRES_DB: ${POSTGRES_DB:-olist}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  pipeline:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-olist}
      PGPASSWORD: ${POSTGRES_PASSWORD:-olist_local}
      PGDATABASE: ${POSTGRES_DB:-olist}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
volumes:
  postgres_data:
